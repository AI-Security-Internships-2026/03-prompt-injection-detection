name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  # Offline suite: no network, no API keys, no torch/transformers/garak.
  # Uses only the tested-compatible interpreter (Python 3.14; see
  # reports/python-modernization.md). Add "3.13" here only after it is proven
  # green against every required dependency group.
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev) with pinned constraints
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c requirements/constraints-python314.txt
      - name: pip check
        run: python -m pip check
      - name: Unit + security + evaluation tests (offline) with coverage
        run: python -m pytest --cov --cov-report=term-missing
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy (typed core)
        run: mypy src
      - name: Bandit (excluding heavy legacy scripts)
        run: bandit -r src -x src/guardrail_comparison.py,src/explore_hackaprompt.py
      - name: pip-audit
        run: pip-audit || true  # advisory: report vulns, do not hard-fail CI
      - name: Artifact manifest hash validation
        run: |
          python - <<'PY'
          import model_loader as m, sys
          sys.path.insert(0, "src")
          for name in ("classifier.pkl", "vectorizer.pkl"):
              entry = m.verify_artifact(m.MODELS_DIR / name)
              assert entry["actual_sha256"] == entry["sha256"], name
              assert entry["trusted"] is False, name
          print("artifact hashes verified; artifacts correctly marked untrusted")
          PY

  # Live provider integration. Manual only; never runs on fork PRs; needs a
  # secret. Kept separate so the offline suite never requires credentials.
  live-provider:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: live-llm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install with LLM extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,llm]" -c requirements/constraints-python314.txt
      - name: Run network-marked tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m pytest -m "network or groq"
