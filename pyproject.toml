[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-injection-detection"
version = "0.2.0"
description = "Prompt-injection detection and defence layer for LLM-based applications."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
authors = [
    { name = "Ehsanullah (AI Security Internship 2026)" },
]

# Core runtime dependencies ONLY.
# The deterministic detector (src/detection_utils.py) is stdlib-only and needs
# none of these; they are required by the ML detector (src/ml_detector.py).
# Optional provider / comparison / integration deps live in extras below so the
# detector and its offline unit tests run without them.
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "mypy>=1.11,<3",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
]
# Live LLM provider integration (network + API key required).
llm = [
    "groq>=1,<2",
]
# Guardrail comparison benchmark (heavy; large downloads).
comparison = [
    "torch>=2.4,<3",
    "transformers>=4.44,<6",
    "llm-guard>=0.3,<1",
    "datasets>=2.20,<5",
]
# Garak red-team integration (heavy; pulls torch + transformers).
garak = [
    "garak>=0.9,<1",
]
# Transformer prompt-guard baselines for the canonicalization experiment
# (e.g. PIGuard / leolee99, microsoft/deberta-v3-base). Heavy: pulls torch.
guards = [
    "huggingface-hub>=0.24",
    "torch>=2.4,<3",
    "transformers>=4.44,<6",
    "sentencepiece>=0.2,<1",
]
# Training-data fetch + multilingual augmentation for the reproducible RANA model.
data = [
    "datasets>=2.20,<5",
    "deep-translator>=1.11,<2",
]

[project.urls]
Homepage = "https://github.com/AI-Security-Internships-2026/03-prompt-injection-detection"

# ---------------------------------------------------------------------------
# Packaging: flat modules living under src/. package-dir "" = "src" puts src/
# on sys.path for editable installs, so the existing flat imports
# (`import detection_utils`) keep working without a package refactor.
# ---------------------------------------------------------------------------
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "detection_utils",
    "model_loader",
    "provider_outcome",
    "eval_checks",
    "rana_model",
    "canonicalize",
    "adversarial",
    "ml_detector",
    "test_harness",
    "interactive_tester",
    "read_garak_report",
]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "network: test requires outbound network access",
    "groq: test requires the Groq SDK and GROQ_API_KEY",
    "garak: test requires the Garak integration",
]

[tool.coverage.run]
source = ["detection_utils", "model_loader", "provider_outcome", "eval_checks", "rana_model", "canonicalize", "adversarial"]
branch = true

[tool.coverage.report]
show_missing = true
# Realistic threshold measured on the deterministic layer (see
# reports/final-results.md). Raise as coverage of ml_detector/harness improves.
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py314"
# Legacy intern scripts carry heavy optional deps and pre-existing style; they
# are excluded from lint until separately refactored (documented in the audit).
extend-exclude = ["src/guardrail_comparison.py", "src/explore_hackaprompt.py", "src/main.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
warn_unused_ignores = true
ignore_missing_imports = true
# Strict untyped-def enforcement on the security-critical deterministic layer.
disallow_untyped_defs = true
# Heavy legacy scripts require torch/llm-guard/datasets just to import; they are
# excluded from type-checking pending a separate refactor (documented in audit).
exclude = '(guardrail_comparison|explore_hackaprompt)\.py$'

[[tool.mypy.overrides]]
# Runtime CLI scripts interface with untyped external SDK objects (Groq); the
# strict untyped-def rule is relaxed for them but they are still type-checked.
module = ["test_harness", "interactive_tester", "ml_detector", "read_garak_report", "main"]
disallow_untyped_defs = false

[tool.bandit]
# Run via `bandit -r src -c pyproject.toml`. The safe model-loader and the
# hash-verified ml_detector load path call pickle behind path+hash+trust
# verification; those calls carry narrow inline `# nosec` justifications.
# The two heavy legacy comparison/exploration scripts (guardrail_comparison,
# explore_hackaprompt) require torch/llm-guard/datasets to import and are
# excluded pending a separate refactor.
exclude_dirs = ["tests", ".venv314", ".venv"]
skips = []

[tool.bandit.assert_used]
skips = ["*/tests/*"]
